[alembic]
# Path to migration scripts
script_location = migrations

# Jinja2 template used for new migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# sys.path is prepended with this path when running env.py
prepend_sys_path = .

# Timezone for revision file timestamps
timezone = UTC

# Separator between revision ID components
version_path_separator = os

# sqlalchemy.url is intentionally blank — env.py reads from app settings at runtime.
# To generate a migration locally: export DATABASE_URL=... then run alembic revision.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
