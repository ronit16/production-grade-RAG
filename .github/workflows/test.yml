name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Run unit tests (no containers required)
        run: pytest tests/unit/ -v --no-containers

  regression:
    name: Regression Tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Install system deps for document parsing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpoppler-cpp-dev poppler-utils libmagic1 tesseract-ocr

      - name: Generate test JWT keypair
        run: |
          mkdir -p secrets
          openssl genrsa -out secrets/jwt_private.pem 2048
          openssl rsa -in secrets/jwt_private.pem -pubout -out secrets/jwt_public.pem

      - name: Run regression tests (Testcontainers auto-starts services)
        env:
          SECRET_KEY: "ci-test-secret-key-minimum-32-chars-xx"
          OPENAI_API_KEY: "sk-test-fake-openai-key-for-ci"
          MINIO_ACCESS_KEY: "minioadmin"
          MINIO_SECRET_KEY: "minioadmin"
          APP_ENV: "test"
        run: pytest tests/regression/ -v

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Generate test JWT keypair
        run: |
          mkdir -p secrets
          openssl genrsa -out secrets/jwt_private.pem 2048
          openssl rsa -in secrets/jwt_private.pem -pubout -out secrets/jwt_public.pem

      - name: Run integration tests
        env:
          SECRET_KEY: "ci-test-secret-key-minimum-32-chars-xx"
          OPENAI_API_KEY: "sk-test-fake-openai-key-for-ci"
          MINIO_ACCESS_KEY: "minioadmin"
          MINIO_SECRET_KEY: "minioadmin"
          APP_ENV: "test"
        run: pytest tests/integration/ -v

  quality-gate:
    name: Quality Gate (RAGAS Evaluation)
    runs-on: ubuntu-latest
    needs: [unit, regression]
    # Run on every PR and push to main.
    # Steps that need real API keys guard themselves with `if: env.KEY != ''`
    # so fork PRs (which never receive secrets) skip cleanly.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Install system deps for document parsing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpoppler-cpp-dev poppler-utils libmagic1 tesseract-ocr

      - name: Generate test JWT keypair
        run: |
          mkdir -p secrets
          openssl genrsa -out secrets/jwt_private.pem 2048
          openssl rsa -in secrets/jwt_private.pem -pubout -out secrets/jwt_public.pem

      - name: Run RAGAS quality gate
        # Skip when API keys are absent (fork PRs, Dependabot — secrets are empty)
        if: env.OPENAI_API_KEY != '' && env.GEMINI_API_KEY != ''
        env:
          SECRET_KEY: "ci-test-secret-key-minimum-32-chars-xx"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MINIO_ACCESS_KEY: "minioadmin"
          MINIO_SECRET_KEY: "minioadmin"
          APP_ENV: "test"
          # Cap to 30 samples in CI to control cost and runtime (~20 min).
          # Remove this cap to run all 62 samples locally.
          EVAL_SAMPLE_LIMIT: "30"
        run: pytest tests/evaluation/ -m slow -v --tb=short

      - name: Skip notice (no API keys configured)
        if: env.OPENAI_API_KEY == '' || env.GEMINI_API_KEY == ''
        run: |
          echo "⚠️  Skipping RAGAS evaluation — OPENAI_API_KEY or GEMINI_API_KEY not configured."
          echo "Add them as GitHub repository secrets to enable the quality gate."

      - name: Write metrics to job summary
        if: always()
        run: |
          if [ -f eval_summary.json ]; then
            python scripts/ci_eval_summary.py eval_summary.json >> $GITHUB_STEP_SUMMARY
          else
            echo "## RAGAS Evaluation" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No evaluation ran (API keys not configured or test skipped)." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload eval report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-eval-report-${{ github.sha }}
          path: eval_summary.json
          if-no-files-found: ignore
          retention-days: 30
