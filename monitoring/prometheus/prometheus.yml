global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: rag_local

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  # FastAPI application metrics
  - job_name: "fastapi"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  # OTel Collector self-metrics
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]

  # OTel Collector Prometheus exporter (app metrics forwarded via OTel)
  - job_name: "otel-collector-exporter"
    static_configs:
      - targets: ["otel-collector:8889"]

  # Flower Celery monitoring
  - job_name: "flower"
    static_configs:
      - targets: ["flower:5555"]
    metrics_path: /metrics

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
