global:
  resolve_timeout: 5m
  # Configure SMTP for email alerts (update with real credentials)
  # smtp_smarthost: "smtp.gmail.com:587"
  # smtp_from: "alerts@yourdomain.com"
  # smtp_auth_username: "alerts@yourdomain.com"
  # smtp_auth_password: "your-app-password"

route:
  group_by: ["alertname", "slo", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default

  routes:
    - match:
        severity: critical
      receiver: critical_receiver
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: default
      repeat_interval: 4h

receivers:
  - name: default
    # Uncomment and configure for email alerts:
    # email_configs:
    #   - to: "oncall@yourdomain.com"
    #     send_resolved: true

  - name: critical_receiver
    # email_configs:
    #   - to: "oncall@yourdomain.com"
    #     send_resolved: true
    # webhook_configs:
    #   - url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
    #     send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname"]
